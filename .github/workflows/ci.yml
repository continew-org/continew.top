name: CI

# 提交与 PR 的质量门禁：lint、类型检查、构建（各项目 docs/ 未同步时使用分区占位骨架）。

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装 pnpm
        # 固定到 v4.3.0 提交，避免浮动标签被改写（Sonar githubactions:S7637）。
        # actions/* 属 Sonar 认可的受信发布方，保持浮动主版本。
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: 类型检查
        run: pnpm types:check

      # /timeline 的 Star 趋势与提交热力图在构建期读 GitHub 接口，而 stargazers
      # 接口要求认证（未认证 401），认证后限流也才够用。CI 用 Actions 自动生成的
      # 仓库级只读令牌即可，不需要额外配置 secret。
      - name: 构建
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm build

      - name: UI 契约检查
        run: pnpm ui:check

      # 不在此处跑 links:check：CI 不拉取各项目 docs/，分区只剩骨架，真实文档路由不存在，
      # 该步骤会结构性必挂。站内链接校验留在 Deploy（文档汇聚后、rsync 前）执行。
