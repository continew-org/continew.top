name: Mirror

# 单向镜像到 Gitee 与 AtomGit：GitHub 是唯一写入点，镜像平台只读。
#
# 范围：main、dev、形如 4.2.x 的版本分支 + 全部标签；feat/fix 等 PR 分支不镜像。
# 推送带 --prune，镜像侧多余的分支与上游已删的标签会被删除（删除项打印在日志里）。
# 白名单内的分支若在镜像侧有上游没有的提交，分叉检查会报错停下，不覆盖。
#
# secrets：GITEE_USER/GITEE_TOKEN、ATOMGIT_USER/ATOMGIT_TOKEN；缺哪组就跳过哪个平台。

on:
  # 不用 branches 过滤：镜像的是白名单内的全部分支，且各仓库默认分支不同，
  # 写成 branches: [main] 在 dev 仓会静默不触发。
  push:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只演练：校验凭据与分叉，列出将要推送/删除的 ref 但不改动远端'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mirror
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # 镜像平台上的组织名（GitHub 是 continew-org）；仓库名沿用 GitHub，复制到各仓库无需改
      MIRROR_OWNER: continew
    steps:
      - name: 克隆 GitHub 侧仓库
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 用 --bare 不用 --mirror：后者会把 refs/pull/*、refs/remotes/*、notes 也拉下来推过去
          git clone --bare \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo.git

      - name: 过滤镜像分支
        run: |
          set -euo pipefail
          # git refspec 不支持 [0-9] 字符类，且任一模式无匹配会让整次 push 失败，
          # 所以白名单在 shell 里判定，推送仍用全量 refspec。
          while read -r b; do
            case "$b" in
              main|dev|[0-9]*.x) ;;
              *) git -C repo.git update-ref -d "refs/heads/$b"; echo "  不镜像分支: $b" ;;
            esac
          done < <(git -C repo.git for-each-ref --format='%(refname:short)' refs/heads/)

      - name: 镜像到 Gitee 与 AtomGit
        env:
          GITEE_USER: ${{ secrets.GITEE_USER }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          ATOMGIT_USER: ${{ secrets.ATOMGIT_USER }}
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail

          DRY=""
          if [ "$DRY_RUN" = "true" ]; then
            DRY="--dry-run"
            echo "::notice::dry-run 模式：本次不会改动镜像平台"
          fi

          sync() {
            label="$1"; user="${2:-}"; token="${3:-}"; host="$4"
            if [ -z "$token" ]; then
              echo "::notice::未配置 ${label} 凭据，跳过"
              return 0
            fi
            remote="https://${user}:${token}@${host}/${MIRROR_OWNER}/${GITHUB_REPOSITORY#*/}.git"

            # 白名单内的分支若有镜像侧独有提交，强推会抹掉它们，故报错停下
            remote_heads="$(git ls-remote --heads "$remote" 2>/dev/null)" || {
              echo "::error::${label} 不可达（凭据或网络问题），已跳过该平台"
              return 1
            }
            diverged=""
            while read -r sha ref; do
              [ -n "$ref" ] || continue
              branch="${ref#refs/heads/}"
              git -C repo.git rev-parse --verify --quiet "refs/heads/${branch}" >/dev/null || continue
              if ! git -C repo.git cat-file -e "${sha}^{commit}" 2>/dev/null \
                 || ! git -C repo.git merge-base --is-ancestor "$sha" "refs/heads/${branch}"; then
                diverged="${diverged} ${branch}"
              fi
            done <<< "$remote_heads"

            if [ -n "$diverged" ]; then
              echo "::error::${label} 上这些分支含 GitHub 没有的提交，已停止镜像以免覆盖：${diverged}"
              echo "请先把它们回流到 GitHub，或重置镜像侧分支后重跑本工作流。"
              return 1
            fi

            # $DRY 不加引号：为空时不产生参数
            for attempt in 1 2 3; do
              if git -C repo.git push --prune $DRY "$remote" \
                   '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'; then
                echo "✅ ${label} 已同步"
                return 0
              fi
              echo "::warning::${label} 第 ${attempt} 次推送失败，5 秒后重试"
              sleep 5
            done
            echo "::error::${label} 重试三次后仍推送失败"
            return 1
          }

          sync Gitee   "${GITEE_USER:-}"   "${GITEE_TOKEN:-}"   gitee.com
          sync AtomGit "${ATOMGIT_USER:-}" "${ATOMGIT_TOKEN:-}" atomgit.com
