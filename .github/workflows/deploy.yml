name: Deploy

# 构建并部署 ContiNew 官网与文档站（静态导出，self-hosted runner 本机 rsync 到 Nginx 站点目录）。
# 与 continew-admin-ui 同一套部署模式：runner 与部署机同机，无跨机 SSH、无密码/密钥。
# 流程：拉取各项目仓库 docs/ -> 组装 content/docs -> 容器内静态导出 -> 本机 rsync 到站点目录。
#
# 唯一 secret：SERVER_PATH = Nginx 站点根目录（如 /root/continew/nginx/html）。
# 容错约定：克隆成功而源仓库确无 docs/ 时才降级为分区骨架；克隆失败沿用 runner 本机
# 上次成功同步的文档（::warning 标注可能过期），从未同步过则判定部署失败——
# 绝不让某个分区的内容凭空消失（2026-10-10 曾因此把线上 admin 文档整区换成骨架）。

on:
  push:
    branches: [main]
  # 各项目仓库文档更新后可触发 repository_dispatch（type: docs-updated）重建官网
  repository_dispatch:
    types: [docs-updated]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy-web:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      # 1、检出官网源码
      - name: Checkout
        uses: actions/checkout@v4

      # 2、拉取并组装各项目文档（docs/ 为文档唯一权威源；公开仓库浅克隆）
      - name: 拉取并组装各项目文档
        run: |
          set -e
          # 分区名 -> 源仓库
          declare -A REPOS=(
            [admin]=continew-admin
            [starter]=continew-starter
            [app]=continew-app
          )
          # 上次成功同步的文档在 runner 本机的留存（跨次部署持久）。拉取失败时沿用
          # 它继续部署，而不是把分区静默降级成骨架——克隆失败是基础设施抖动，不是
          # 「没有文档」，二者的后果不该一样。
          cache_root="$HOME/.cache/continew-docs"
          mkdir -p "$cache_root"
          for proj in "${!REPOS[@]}"; do
            repo="${REPOS[$proj]}"
            tmp="$(mktemp -d)"
            dest="content/docs/${proj}"
            cache="$cache_root/$proj"
            if git clone --depth 1 --filter=blob:none --sparse \
                 "https://github.com/continew-org/${repo}.git" "$tmp"; then
              if git -C "$tmp" sparse-checkout set docs 2>/dev/null \
                 && [ -d "$tmp/docs" ]; then
                rm -rf "$dest" "$cache"
                mkdir -p "$dest" "$cache"
                cp -r "$tmp/docs/." "$dest/"
                cp -r "$tmp/docs/." "$cache/"
                echo "✅ 已同步 ${proj} 文档（来自 continew-org/${repo}）"
              else
                # 克隆成功而源仓库确实没有 docs/：保留官网分区骨架，并清掉过期缓存
                rm -rf "$cache"
                echo "ℹ️  ${proj} 仓库无 docs/ 目录，使用官网分区骨架"
              fi
            elif [ -n "$(ls -A "$cache" 2>/dev/null)" ]; then
              rm -rf "$dest"
              mkdir -p "$dest"
              cp -r "$cache/." "$dest/"
              echo "::warning::${proj} 文档拉取失败，已沿用上次成功同步的文档（内容可能落后于源仓库）"
            else
              echo "❌ ${proj} 文档拉取失败，且本机没有可沿用的历史文档；为避免分区内容凭空消失，判定部署失败" >&2
              exit 1
            fi
            rm -rf "$tmp"
          done

      # 3、容器内静态导出（pnpm install 会运行依赖与仓库生命周期脚本，容器隔离其触达范围——
      #    不挂 docker.sock、不注入 job secrets；pnpm 版本由 packageManager 经 corepack 解析）
      - name: Build
        run: >
          docker run --rm
          --memory=4g --cpus=4
          -v "$PWD":/ws -w /ws
          -v /root/.local/share/pnpm:/root/.local/share/pnpm
          -v /root/.cache:/root/.cache
          node:22
          bash -c "corepack enable && pnpm i --frozen-lockfile && pnpm build"

      # 4、同步部署文件到 Nginx 站点目录（--delete 保证与构建产物一致，清理已下线页面）
      - name: Copy
        run: |
          rsync -a --delete out/ ${{ secrets.SERVER_PATH }}/
          chmod -R 777 ${{ secrets.SERVER_PATH }}
