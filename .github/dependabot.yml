# Dependabot 依赖更新配置。
# npm 生态按周检查；GitHub Actions 按月检查。版本由 pnpm-workspace.yaml 的 catalog 统一管理。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # fumadocs 相关包需同版本协同升级，归为一组避免单独 bump 破坏 peer 约束
      fumadocs:
        patterns:
          - 'fumadocs-*'
          - '@fumadocs/*'
      next-react:
        patterns:
          - 'next'
          - 'react'
          - 'react-dom'
          - 'eslint-config-next'
          - '@types/react'
          - '@types/react-dom'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
